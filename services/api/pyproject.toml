[project]
name = "opentransit-api"
version = "0.1.0"
description = "OpenTransit scheduled journey API (local preview)"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.135,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.12,<3",
  "uvicorn>=0.41,<1",
  "tzdata>=2026.1",
]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.15,<1"]

[project.scripts]
opentransit = "opentransit.build.cli:main"

[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opentransit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running API with real MOTIS data"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
